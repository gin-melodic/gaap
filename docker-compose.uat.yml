name: gaap-uat

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/caddy/Caddyfile.uat:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gaap-api:
        condition: service_healthy
      gaap-web:
        condition: service_healthy
    networks:
      - edge

  gaap-api:
    image: gaap-api:uat-local
    build:
      context: ./gaap-api
      target: production
    restart: unless-stopped
    env_file:
      - .env.uat
    environment:
      GF_ENV: production
      GF_GCFG_FILE: config.prod.yaml
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-gaap_uat}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-gaap-uat-rabbitmq-local-only-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8000/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
      - data

  gaap-web:
    image: gaap-web:uat-local
    build:
      context: ./gaap-web
      target: production
      args:
        NEXT_PUBLIC_ALE_BOOTSTRAP_KEY: ${NEXT_PUBLIC_ALE_BOOTSTRAP_KEY:?set NEXT_PUBLIC_ALE_BOOTSTRAP_KEY}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?set NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env.uat
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env.uat
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

  rabbitmq:
    image: rabbitmq:4.1.8-alpine
    restart: unless-stopped
    env_file:
      - .env.uat
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gaap_uat}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gaap-uat-rabbitmq-local-only-2026}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data

networks:
  edge:
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  rabbitmq_data:
