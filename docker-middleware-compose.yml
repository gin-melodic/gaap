services:
  # ==================== Caddy Reverse Proxy ====================
  caddy:
    image: caddy:2.8-alpine
    container_name: gaap-caddy-dev
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "2019:2019"  # Caddy Admin API
    volumes:
      # Caddy configuration
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      
      # Persistent data (certificates, etc.)
      - ./volumes/caddy/data:/data
      - ./volumes/caddy/config:/config
      
      # User uploads (if serving static files)
      - ./volumes/uploads:/var/www/uploads
    environment:
      - DEV_DOMAIN=${DEV_DOMAIN:-gaap.local}
    networks:
      - gaap-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== PostgreSQL Database ====================
  postgres:
    image: postgres:18
    container_name: gaap-postgres-dev
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./gaap-api/manifest/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gaap-network

  # ==================== Redis Cache ====================
  redis:
    image: redis:7-alpine
    container_name: gaap-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ./volumes/redis:/data
    networks:
      - gaap-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== RabbitMQ Message Queue ====================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gaap-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gaap-network

networks:
  gaap-network:
    driver: bridge
